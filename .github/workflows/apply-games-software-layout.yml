name: Apply Games and Software Layout

on:
  push:
    paths:
      - "scripts/update_games_software_layout.py"
      - ".github/workflows/apply-games-software-layout.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout update
        run: python scripts/update_games_software_layout.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/site.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Validate Games and Software UI
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'A record of the games I am currently developing.',
              '這裡紀錄我目前製作的遊戲。',
              'A record of the software I am currently developing.',
              '這裡紀錄我目前製作的軟體。',
              'nameZh:"文明重建"',
              'descriptionZh:"基於真實世界規則的文明建立遊戲"',
              'className="fiction-work project-work"',
              'makeText("span","fiction-status",project.status)',
              'project-work-description-zh'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing required UI markers: {missing}')
          assert 'project.description' not in html
          print('Games and Software UI validation passed.')
          PY

      - name: Commit final site and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/update_games_software_layout.py .github/workflows/apply-games-software-layout.yml
          git commit -m "feat: align Games and Software project sections"
          git push
