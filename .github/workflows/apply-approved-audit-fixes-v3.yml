name: Run Approved Portfolio Audit Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-audit-fixes-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply migration
        run: python .github/scripts/apply-approved-audit-fixes.py
      - name: Validate JavaScript
        run: node --check /tmp/site.js
      - name: Commit final site and clean migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-approved-audit-fixes.yml
          rm -f .github/workflows/apply-approved-audit-fixes-v3.yml
          rm -f .github/scripts/apply-approved-audit-fixes.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "fix: apply approved portfolio audit corrections"
          git push origin main
