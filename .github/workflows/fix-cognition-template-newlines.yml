name: Fix Cognition template newlines

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-cognition-template-newlines.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render Cognition newlines as BR elements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.cognition-thought{max-width:760px;margin:18px 0 0;color:var(--text);font-size:17px;line-height:1.95;white-space:pre-wrap}'
          new_css = '.cognition-thought{max-width:760px;margin:18px 0 0;color:var(--text);font-size:17px;line-height:1.95;white-space:normal}'
          if old_css not in text:
              raise SystemExit('Expected Cognition thought CSS not found')
          text = text.replace(old_css, new_css, 1)

          old_helper = 'function makeText(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;element.textContent=text;return element}function normalizeCognitionBreaks(text){const value=String(text??"");return value.split(String.fromCharCode(92)+"n").join(String.fromCharCode(10))}'
          new_helper = 'function makeText(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;element.textContent=text;return element}function normalizeCognitionBreaks(text){const value=String(text??"");return value.split(String.fromCharCode(92)+"n").join(String.fromCharCode(10))}function makeCognitionMultiline(tag,className,text){const element=document.createElement(tag);if(className)element.className=className;const lines=normalizeCognitionBreaks(text).replace(/\\r\\n?/g,"\\n").split("\\n");lines.forEach((line,index)=>{if(index)element.appendChild(document.createElement("br"));element.appendChild(document.createTextNode(line))});return element}'
          if old_helper not in text:
              raise SystemExit('Expected Cognition helper block not found')
          text = text.replace(old_helper, new_helper, 1)

          old_chain = 'theory.chain.forEach(item=>chain.appendChild(makeText("div","cognition-chain-step",normalizeCognitionBreaks(item))))'
          new_chain = 'theory.chain.forEach(item=>chain.appendChild(makeCognitionMultiline("div","cognition-chain-step",item)))'
          if old_chain not in text:
              raise SystemExit('Expected chain renderer not found')
          text = text.replace(old_chain, new_chain, 1)

          old_thought = 'makeText("p","cognition-thought",normalizeCognitionBreaks(reflection.thought))'
          new_thought = 'makeCognitionMultiline("div","cognition-thought",reflection.thought)'
          if old_thought not in text:
              raise SystemExit('Expected thought renderer not found')
          text = text.replace(old_thought, new_thought, 1)

          required = [
              'function makeCognitionMultiline',
              'document.createElement("br")',
              'makeCognitionMultiline("div","cognition-thought",reflection.thought)',
              'makeCognitionMultiline("div","cognition-chain-step",item)',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing explicit line-break renderer: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          code = '\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(code)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          PY

      - name: Verify explicit break semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          if 'document.createElement("br")' not in text:
              raise SystemExit('BR renderer missing')
          if 'makeText("p","cognition-thought",normalizeCognitionBreaks(reflection.thought))' in text:
              raise SystemExit('Old whitespace-dependent renderer remains')
          print('Cognition line breaks are now explicit DOM BR elements')
          PY

      - name: Commit fix
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Render Cognition line breaks explicitly"
          git push
