name: Apply Survival Skills

on:
  push:
    paths:
      - "scripts/apply_survival_page.py"
      - ".github/workflows/apply-survival.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch site
        run: python scripts/apply_survival_page.py

      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/site.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Validate Survival Skills anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="survivalPage"',
              'id="survivalNode-threats"',
              'id="survivalNode-priority"',
              'const survivalAssessmentNodes=',
              'if(category==="Survival Skills"){showSurvival(push);return}',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit('Missing required tokens: ' + ', '.join(missing))
          print('Survival Skills validation passed.')
          PY

      - name: Commit final site and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/apply_survival_page.py .github/workflows/apply-survival.yml
          git commit -m "feat: add Survival Skills situation assessment"
          git push
