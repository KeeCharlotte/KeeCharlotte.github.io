name: Apply Fiction hero balance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-fiction-hero-balance.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine Fiction hero layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.fiction-hero-grid{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:42px;align-items:start;padding-top:8px;border-top:1px solid var(--line)}',
                  '.fiction-hero-grid{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,1fr);gap:46px;align-items:center;padding-top:30px;border-top:1px solid var(--line)}'
              ),
              (
                  '.fiction-cover-wrap{position:relative;margin-top:30px}',
                  '.fiction-cover-wrap{position:relative;margin-top:0}'
              ),
              (
                  '.fiction-overview{display:flex;min-height:500px;flex-direction:column;padding-top:30px}',
                  '.fiction-overview{display:flex;flex-direction:column;padding-top:0}'
              ),
              (
                  '.fiction-profile{margin-top:24px;padding:20px 0 21px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}',
                  '.fiction-profile{margin-top:16px;padding:20px 22px;border:1px solid var(--line);border-radius:var(--radius-card);background:rgba(26,20,32,.34)}'
              ),
              (
                  '.fiction-hero-grid{grid-template-columns:minmax(220px,300px) minmax(0,1fr)}.fiction-overview{min-height:450px}',
                  '.fiction-hero-grid{grid-template-columns:minmax(210px,260px) minmax(0,1fr)}'
              ),
              (
                  '.fiction-hero-grid{grid-template-columns:1fr}.fiction-cover-wrap{max-width:300px;margin:30px auto 0}',
                  '.fiction-hero-grid{grid-template-columns:1fr;align-items:start}.fiction-cover-wrap{max-width:300px;margin:30px auto 0}'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected CSS anchor not found: {old}')
              text = text.replace(old, new, 1)

          forbidden = [
              'fiction-overview{display:flex;min-height:500px',
              '.fiction-overview{min-height:450px}',
              'grid-template-columns:minmax(250px,330px)',
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Legacy Fiction hero rule still present: {item}')

          required = [
              'grid-template-columns:minmax(210px,260px) minmax(0,1fr);gap:46px;align-items:center',
              '.fiction-cover-wrap{position:relative;margin-top:0}',
              '.fiction-overview{display:flex;flex-direction:column;padding-top:0}',
              '.fiction-profile{margin-top:16px;padding:20px 22px;border:1px solid var(--line);border-radius:var(--radius-card);background:rgba(26,20,32,.34)}',
              '.fiction-hero-grid{grid-template-columns:1fr;align-items:start}'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected Fiction hero result: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('script block not found')
          Path('/tmp/site.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Commit changes
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Balance Unreachable Sincerity hero layout"
          git push origin main
