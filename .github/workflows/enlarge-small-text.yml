name: Enlarge small text

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enlarge-small-text.yml

permissions:
  contents: write

jobs:
  enlarge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase fixed small font sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'small-text-scale:+2px' in text:
              raise SystemExit('Small-text scale already applied')

          start = text.index('<style>')
          end = text.index('</style>', start)
          css = text[start:end]

          counts = {}
          def repl(match):
              old = int(match.group(1))
              new = old + 2
              counts[old] = counts.get(old, 0) + 1
              return f'font-size:{new}px'

          css, total = re.subn(r'font-size:(10|11|12|13|14|15)px', repl, css)
          if total == 0:
              raise SystemExit('No fixed 10–15px font sizes found')

          css = css.replace('<style>', '<style>\n    /* small-text-scale:+2px */', 1)
          text = text[:start] + css + text[end:]
          path.write_text(text, encoding='utf-8')

          print('Updated', total, 'font-size declarations')
          for size in sorted(counts):
              print(f'{size}px -> {size + 2}px: {counts[size]}')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          code = '\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(code)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          PY

      - name: Commit enlarged text
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enlarge small text across portfolio"
          git push
