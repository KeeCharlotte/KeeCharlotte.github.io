name: Apply Survival Tree Layout

on:
  push:
    paths:
      - "scripts/fix_survival_tree_layout.py"
      - ".github/workflows/apply-survival-tree-layout.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply balanced tree layout
        run: python scripts/fix_survival_tree_layout.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/site.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Validate balanced Survival tree
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'grid-template-columns:repeat(5,minmax(0,1fr))' in html
          assert 'left:10%;right:10%' in html
          assert '.survival-subbranches::before,.survival-subbranches::after' in html
          assert '.survival-subnode::before,.survival-subnode::after' in html
          assert 'grid-template-columns:repeat(6,minmax(0,1fr))' not in html
          print('Balanced Survival tree validation passed.')
          PY

      - name: Commit final site and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/fix_survival_tree_layout.py .github/workflows/apply-survival-tree-layout.yml
          git commit -m "fix: rebalance Survival Skills tree layout"
          git push
