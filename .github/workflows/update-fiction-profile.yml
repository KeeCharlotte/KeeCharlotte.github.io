name: Update Fiction work profile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-fiction-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Fiction profile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_css = r'''.fiction-overview{display:flex;min-height:500px;flex-direction:column;padding-top:30px}.fiction-section-kicker{margin:0;color:var(--rose);font-family:var(--mono);font-size:12px;font-weight:550;letter-spacing:.09em}.fiction-profile{margin-top:24px;padding:18px 0 19px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.fiction-profile-line{display:flex;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.7;letter-spacing:.035em}.fiction-profile-line span:not(:last-child)::after{content:"·";margin:0 12px;color:var(--muted-dark)}.fiction-profile-primary{color:var(--text);font-family:var(--serif);font-size:21px;font-weight:650;letter-spacing:0}.fiction-profile-tags{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:13px}.fiction-profile-tag{color:var(--muted);font-family:var(--mono);font-size:11px;line-height:1.65;letter-spacing:.025em}'''
          new_css = r'''.fiction-overview{display:flex;min-height:500px;flex-direction:column;padding-top:30px}.fiction-profile-head{display:flex;align-items:baseline;justify-content:space-between;gap:24px}.fiction-section-kicker{margin:0;color:var(--rose);font-family:var(--mono);font-size:12px;font-weight:550;letter-spacing:.09em}.fiction-profile-period{color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.6;letter-spacing:.035em;text-align:right}.fiction-profile{margin-top:24px;padding:20px 0 21px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.fiction-profile-row{display:flex;align-items:baseline;gap:8px;margin:0;color:var(--muted);font-size:14px;line-height:1.8}.fiction-profile-row+.fiction-profile-row{margin-top:4px}.fiction-profile-label-text{color:var(--muted)}.fiction-profile-author{color:var(--text);font-weight:500}.fiction-profile-word-count{color:var(--text);font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:0}.fiction-profile-tags{display:grid;gap:5px;margin-top:15px}.fiction-profile-tag-line{display:flex;flex-wrap:wrap;gap:8px 16px}.fiction-profile-tag{color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1.65;letter-spacing:.025em}'''
          if old_css not in s:
              raise SystemExit('Expected Fiction profile CSS block not found')
          s = s.replace(old_css, new_css, 1)

          # Mobile: let the work-profile heading wrap cleanly on narrow screens.
          old_mobile = '.fiction-overview{min-height:0}.fiction-thesis{margin-top:28px}'
          new_mobile = '.fiction-overview{min-height:0}.fiction-profile-head{align-items:flex-start;flex-direction:column;gap:6px}.fiction-profile-period{text-align:left}.fiction-thesis{margin-top:28px}'
          if old_mobile not in s:
              raise SystemExit('Expected Fiction mobile CSS anchor not found')
          s = s.replace(old_mobile, new_mobile, 1)

          # Remove obsolete Completed data field.
          s = s.replace('          status:"Completed",\n', '', 1)

          old_render = '''const overview=document.createElement("div");overview.className="fiction-overview";overview.appendChild(makeText("p","fiction-section-kicker","Work profile · 作品名片"));const profile=document.createElement("div");profile.className="fiction-profile";const profileLine=document.createElement("div");profileLine.className="fiction-profile-line";profileLine.append(makeText("span","fiction-profile-primary",detail.wordCount+" 字"),makeText("span","",detail.status||"Completed"),makeText("span","",work.period));const profileTags=document.createElement("div");profileTags.className="fiction-profile-tags";detail.genres.forEach(tag=>profileTags.appendChild(makeText("span","fiction-profile-tag","#"+tag)));profile.append(profileLine,profileTags);overview.appendChild(profile);'''
          new_render = '''const overview=document.createElement("div");overview.className="fiction-overview";const profileHead=document.createElement("div");profileHead.className="fiction-profile-head";profileHead.append(makeText("p","fiction-section-kicker","Work profile · 作品名片"),makeText("span","fiction-profile-period",work.period));overview.appendChild(profileHead);const profile=document.createElement("div");profile.className="fiction-profile";const authorRow=document.createElement("p");authorRow.className="fiction-profile-row";authorRow.append(makeText("span","fiction-profile-label-text","作者:"),makeText("span","fiction-profile-author","KeeCharlotte"));const wordRow=document.createElement("p");wordRow.className="fiction-profile-row";wordRow.append(makeText("span","fiction-profile-label-text","總字數:"),makeText("strong","fiction-profile-word-count",detail.wordCount+" 字"));const profileTags=document.createElement("div");profileTags.className="fiction-profile-tags";const tagLines=[detail.genres.slice(0,2),detail.genres.slice(2)];tagLines.forEach(tags=>{const line=document.createElement("div");line.className="fiction-profile-tag-line";tags.forEach(tag=>line.appendChild(makeText("span","fiction-profile-tag","#"+tag)));profileTags.appendChild(line)});profile.append(authorRow,wordRow,profileTags);overview.appendChild(profile);'''
          if old_render not in s:
              raise SystemExit('Expected Fiction profile renderer not found')
          s = s.replace(old_render, new_render, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('script block not found')
          Path('/tmp/site.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Commit update
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Unreachable Sincerity work profile"
          git push origin main
