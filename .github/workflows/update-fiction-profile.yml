name: Update Fiction profile copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-fiction-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Fiction profile copy changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_thesis = 'thesisZh:"真正的理解，不是看透彼此。\\n而是在看不透時，仍願意靠近。",\n          thesisEn:"Understanding is not seeing someone completely,\\nbut choosing to stay close even when you cannot.",'
          new_thesis = 'thesisZh:"有些事情，用說的就能輕易理解。\\n但更多的是，就算通過言語也無法完全表達的情感。",'
          if old_thesis not in text:
              raise SystemExit('Expected bilingual thesis block not found')
          text = text.replace(old_thesis, new_thesis, 1)

          old_size = '.fiction-thesis-zh{margin:0;color:var(--text);font-family:var(--serif);font-size:clamp(24px,2.8vw,34px);'
          new_size = '.fiction-thesis-zh{margin:0;color:var(--text);font-family:var(--serif);font-size:clamp(22px,2.8vw,32px);'
          if old_size not in text:
              raise SystemExit('Expected thesis font-size rule not found')
          text = text.replace(old_size, new_size, 1)

          required = [
              'fiction-profile-head',
              '"Work profile · 作品名片"',
              '"作者:"',
              '"KeeCharlotte"',
              '"總字數:"',
              'detail.wordCount+" 字"',
              'const tagLines=[detail.genres.slice(0,2),detail.genres.slice(2)]',
              '明知這份關係終將截止',
              '但更多的是，就算通過言語也無法完全表達的情感。'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected content: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('script block not found')
          Path('/tmp/site.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Commit changes
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Unreachable Sincerity work profile"
          git push origin main
