name: Refine Fiction presentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refine-fiction.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Apply Fiction refinement
        run: python scripts/refine_fiction.py

      - name: Commit refined Fiction page
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/unreachable-sincerity-cover.png
          git commit -m "Refine Fiction work presentation"
          git push origin main
