name: Apply Survival Skills Hierarchy

on:
  push:
    paths:
      - "scripts/restructure_survival.py"
      - ".github/workflows/apply-survival-hierarchy.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restructure Survival Skills
        run: python scripts/restructure_survival.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/site.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Validate hierarchy and public copy
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="survivalPage"',
              'id="survivalCategoryPage"',
              'id="survivalDetailPage"',
              '#ability/Survival%20Skills/situation-assessment',
              'openSurvivalDetail(\'threats\')',
              '這裡介紹我目前學到的荒野求生知識。',
              '核心判斷原則',
          ]
          forbidden = [
              'A decision-based survival knowledge system built from real-world evidence',
              'Baseline scenario · alone · naked · outdoors · no equipment',
              'REALITY TRANSFER',
              'SIMULATION TRANSFER',
              'Survival Truth Rule',
              'SIMULATION VARIABLES',
          ]
          missing = [x for x in required if x not in html]
          leaked = [x for x in forbidden if x in html]
          if missing:
              raise SystemExit('Missing required content: ' + ', '.join(missing))
          if leaked:
              raise SystemExit('Removed internal copy is still public: ' + ', '.join(leaked))
          for view_id in ['survivalPage','survivalCategoryPage','survivalDetailPage']:
              count = html.count(f'id="{view_id}"')
              if count != 1:
                  raise SystemExit(f'{view_id} id count: {count}')
          print('Survival hierarchy validation passed.')
          PY

      - name: Commit final site and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/restructure_survival.py .github/workflows/apply-survival-hierarchy.yml
          git commit -m "refactor: restructure Survival Skills knowledge hierarchy"
          git push
