name: Fix Cognition line breaks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-cognition-linebreaks.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Cognition newline normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          safe_helper = 'function normalizeCognitionBreaks(text){const value=String(text??"");return value.split(String.fromCharCode(92)+"n").join(String.fromCharCode(10))}'
          s, count = re.subn(
              r'function normalizeCognitionBreaks\(text\)\{.*?\}(?=\n\s*function renderFictionDetailBody)',
              safe_helper,
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one normalizeCognitionBreaks helper, replaced {count}')

          required = [
              'white-space:pre-wrap',
              safe_helper,
              'normalizeCognitionBreaks(reflection.thought)',
              'normalizeCognitionBreaks(item)',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'Missing repaired line-break behavior: {item}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify newline behavior
        run: |
          node - <<'NODE'
          function normalizeCognitionBreaks(text){const value=String(text??"");return value.split(String.fromCharCode(92)+"n").join(String.fromCharCode(10))}
          const literal = "第一段" + String.fromCharCode(92) + "n" + "第二段";
          const expected = "第一段" + String.fromCharCode(10) + "第二段";
          if (normalizeCognitionBreaks(literal) !== expected) {
            throw new Error("Literal newline escape was not normalized");
          }
          if (normalizeCognitionBreaks(expected) !== expected) {
            throw new Error("Existing real newline was altered");
          }
          NODE

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          code = '\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(code)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          PY

      - name: Commit line break repair
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Harden Cognition line break rendering"
          git push
