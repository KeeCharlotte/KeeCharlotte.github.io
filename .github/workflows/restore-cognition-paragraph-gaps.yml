name: Restore Cognition paragraph gaps

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-cognition-paragraph-gaps.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore blank lines in Cognition reflections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('    const cognitionThemes={')
          end = text.index('\n\n    const fictionWorks=', start)
          block = text[start:end]

          pattern = re.compile(r'thought:`([^`]*)`')
          changed_fields = 0
          changed_breaks = 0

          def expand(match):
              nonlocal_vars = None
              content = match.group(1)
              before = content.count(r'\n')
              if before == 0:
                  return match.group(0)
              # Normalize any accidental doubles first, then make every intended
              # reflection paragraph break exactly two newline escapes.
              while r'\n\n' in content:
                  content = content.replace(r'\n\n', r'\n')
              count = content.count(r'\n')
              content = content.replace(r'\n', r'\n\n')
              expand.changed_fields += 1
              expand.changed_breaks += count
              return 'thought:`' + content + '`'

          expand.changed_fields = 0
          expand.changed_breaks = 0
          new_block, matches = pattern.subn(expand, block)
          if matches == 0:
              raise SystemExit('No Cognition thought fields found')
          if expand.changed_fields == 0:
              raise SystemExit('No Cognition thought newline escapes found')

          # Verify all thought fields with breaks now use pairs only.
          for m in pattern.finditer(new_block):
              content = m.group(1)
              stripped = content.replace(r'\n\n', '')
              if r'\n' in stripped:
                  raise SystemExit('A single newline escape remains inside a Cognition thought')

          text = text[:start] + new_block + text[end:]
          path.write_text(text, encoding='utf-8')
          print(f'Updated {expand.changed_fields} reflection fields and {expand.changed_breaks} paragraph breaks')
          PY

      - name: Verify explicit BR renderer remains
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function makeCognitionMultiline',
              'document.createElement("br")',
              'makeCognitionMultiline("div","cognition-thought",reflection.thought)',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing Cognition multiline renderer: {item}')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text(encoding='utf-8')
          code = '\n'.join(re.findall(r'<script>(.*?)</script>', text, flags=re.S))
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(code)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          PY

      - name: Commit update
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore paragraph gaps in Cognition reflections"
          git push
