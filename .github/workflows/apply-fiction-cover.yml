name: Apply Fiction cover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-fiction-cover.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire JPEG cover into Fiction page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')

          old_cover = 'cover:"assets/unreachable-sincerity-cover.webp",'
          new_cover = 'cover:"assets/unreachable-sincerity-cover.jpg",'
          if old_cover not in source:
              raise SystemExit('expected WebP cover reference not found')
          source = source.replace(old_cover, new_cover, 1)

          old_img = 'cover.loading="eager";coverWrap.appendChild(cover);'
          new_img = 'cover.loading="eager";cover.decoding="async";cover.width=400;cover.height=600;coverWrap.appendChild(cover);'
          if old_img not in source:
              raise SystemExit('expected cover image initialization not found')
          source = source.replace(old_img, new_img, 1)

          if 'assets/unreachable-sincerity-cover.jpg' not in source:
              raise SystemExit('JPEG cover reference missing after update')
          if 'cover.width=400;cover.height=600' not in source:
              raise SystemExit('cover dimensions missing after update')

          path.write_text(source, encoding='utf-8')

          match = re.search(r'<script>(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('script block not found')
          Path('/tmp/site.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Commit cover wiring
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use JPEG cover for Unreachable Sincerity"
          git push origin main
