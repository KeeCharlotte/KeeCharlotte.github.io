name: Remove Survival Rescue Assumptions

on:
  push:
    paths:
      - "scripts/remove_survival_rescue.py"
      - ".github/workflows/remove-survival-rescue.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove rescue assumptions
        run: python scripts/remove_survival_rescue.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/site.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Validate Survival Skills premise
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          forbidden = [
              "openSurvivalDetail('rescue')",
              'Rescue Situation',
              '獲救可能',
              '求救',
              '搜救',
              '救援',
              'Combine the six assessments',
              'human-made signs',
              '人類痕跡',
              '人工痕跡',
          ]
          leaked = [x for x in forbidden if x in html]
          if leaked:
              raise SystemExit('Rescue assumptions remain: ' + ', '.join(leaked))
          required = [
              '01.5</span><span class="survival-node-en">Available Resources',
              '01.6</span><span class="survival-node-en">Priority Assessment',
              'Combine the five assessments and decide what deserves attention first.',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing required tokens: ' + ', '.join(missing))
          print('Survival premise validation passed.')
          PY

      - name: Commit final site and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f scripts/remove_survival_rescue.py .github/workflows/remove-survival-rescue.yml
          git commit -m "refactor: remove rescue assumptions from Survival Skills"
          git push
