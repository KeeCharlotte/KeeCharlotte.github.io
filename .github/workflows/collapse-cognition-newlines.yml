name: Collapse Cognition newlines

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/collapse-cognition-newlines.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collapse Cognition paragraph breaks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('    const cognitionThemes={')
          end = text.index('\n\n    const fictionWorks=', start)
          block = text[start:end]

          double_escape = r'\n\n'
          single_escape = r'\n'
          before = block.count(double_escape)
          if before == 0:
              raise SystemExit('No Cognition double newline escapes found')

          while double_escape in block:
              block = block.replace(double_escape, single_escape)

          if double_escape in block:
              raise SystemExit('Double newline escape remains in Cognition data')

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          print(f'Collapsed {before} Cognition double-newline escapes to single newlines')
          PY

      - name: Verify explicit BR renderer remains
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function makeCognitionMultiline',
              'document.createElement("br")',
              'makeCognitionMultiline("div","cognition-thought",reflection.thought)',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing explicit Cognition line-break renderer: {item}')
          start = text.index('    const cognitionThemes={')
          end = text.index('\n\n    const fictionWorks=', start)
          if r'\n\n' in text[start:end]:
              raise SystemExit('Cognition still contains double newline escapes')
          print('Cognition now uses one newline per intended break')
          PY

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          code = '\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(code)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          PY

      - name: Commit update
        run: |
          git config user.name "KeeCharlotte"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use single line breaks in Cognition"
          git push
